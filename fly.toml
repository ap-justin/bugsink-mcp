# Edit the three deployment-specific values before `fly deploy`:
#   app          the Fly app name you created with `fly apps create`
#   BUGSINK_URL  the public URL of your Bugsink instance
#   PUBLIC_HOST  the hostname this server is reached at, normally <app>.fly.dev
app = "bugsink-mcp"
# pick the region closest to your Bugsink instance; the volume below must live in it too
primary_region = "sin"

[build]

[env]
  # Use Bugsink's public URL even when it also runs on Fly, not <app>.internal: Bugsink
  # auto-suspends and only a request through the Fly proxy wakes it. It also deduces
  # ALLOWED_HOSTS from BASE_URL, so this Host header is the one it accepts.
  BUGSINK_URL = "https://bugsink.example.com"
  # DNS-rebinding protection rejects any Host header not listed here.
  PUBLIC_HOST = "bugsink-mcp.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    # unauthenticated by design; /mcp itself requires an OAuth token
    path = "/health"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

# OAuth clients and tokens outlive a deploy only if they are on a volume; without
# one, every release would silently disconnect the connector.
[mounts]
  source = "mcp_data"
  destination = "/data"

# Single volume, so a single machine.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
